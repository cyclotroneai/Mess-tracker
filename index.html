<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mess Tracker</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#0f766e;--br:#e5e7eb;--dg:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mut:#9aa3af;--ac:#2dd4bf;--br:#2c333c;--dg:#f87171}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mut:#9aa3af;--ac:#2dd4bf;--br:#2c333c;--dg:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:15px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:10px}.row>*{flex:1}
button.p{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:14px}
button.x{width:auto;padding:4px 10px;border:0;background:none;color:var(--dg);font-size:20px}
table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid var(--br);text-align:left}
th{font-size:12px;color:var(--mut)}.n{text-align:right;font-variant-numeric:tabular-nums}
tr.t td{font-weight:700;border-bottom:0;border-top:2px solid var(--ac)}
.sub{font-size:12px;color:var(--mut)}.big{font-size:28px;font-weight:700;color:var(--ac)}
.wrap{overflow-x:auto}#st{font-size:12px;color:var(--mut);text-align:center}
</style></head><body><main>
<h1>🍽️ Mess Tracker</h1>

<div class="card"><h2>Add expense</h2>
<div class="row"><div><label>Date</label><input type="date" id="d"></div>
<div><label>Amount</label><input type="number" id="a" inputmode="decimal" min="0" step="any" placeholder="0"></div></div>
<label>Member</label><select id="m"></select>
<input id="nm" placeholder="New member name" style="display:none;margin-top:8px">
<label>Remark (optional)</label><input id="r" placeholder="e.g. Vegetables">
<button class="p" id="add">Add</button></div>

<div class="card"><h2>Monthly summary</h2>
<input type="month" id="mo">
<div style="margin:12px 0 4px" class="sub">Total payables</div><div class="big" id="tot">0</div>
<div class="wrap"><table><thead><tr><th>Member</th><th class="n">Amount</th></tr></thead><tbody id="sum"></tbody></table></div></div>

<div class="card"><h2>Daily entries</h2>
<div class="wrap"><table><thead><tr><th>Date</th><th>Member</th><th class="n">Amt</th><th></th></tr></thead><tbody id="list"></tbody></table></div>
<div class="sub" id="empty" style="display:none;padding-top:8px">No entries this month.</div></div>
<div id="st"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const DEF=["Nasru","Muneer","Azeez","Anees","Shameer","Rashif","Ali","Masood"];
let entries=[],db=null,col=null;
const today=()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
$("d").value=today();$("mo").value=today().slice(0,7);

function lsGet(){try{return JSON.parse(localStorage.getItem("mess")||"[]")}catch(e){return[]}}
function lsSet(){try{localStorage.setItem("mess",JSON.stringify(entries))}catch(e){}}

function members(){const s=new Set(DEF);entries.forEach(e=>s.add(e.member));return[...s]}
function fillSel(){const v=$("m").value,ms=members();
 $("m").innerHTML=ms.map(x=>`<option>${esc(x)}</option>`).join("")+'<option value="__new">+ Add new member…</option>';
 if(v&&v!=="__new"&&ms.includes(v))$("m").value=v}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const f=n=>(Math.round(n*100)/100).toLocaleString();

function render(){
 fillSel();
 const mo=$("mo").value,list=entries.filter(e=>e.date.startsWith(mo)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
 const by={};list.forEach(e=>by[e.member]=(by[e.member]||0)+e.amount);
 const tot=list.reduce((s,e)=>s+e.amount,0);
 $("tot").textContent=f(tot);
 $("sum").innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${f(v)}</td></tr>`).join("")+`<tr class="t"><td>Total</td><td class="n">${f(tot)}</td></tr>`;
 $("list").innerHTML=list.map(e=>`<tr><td>${e.date.slice(8)}/${e.date.slice(5,7)}</td><td>${esc(e.member)}${e.remark?`<div class="sub">${esc(e.remark)}</div>`:""}</td><td class="n">${f(e.amount)}</td><td><button class="x" data-id="${esc(e.id)}" aria-label="Delete">×</button></td></tr>`).join("");
 $("empty").style.display=list.length?"none":"block";
}

$("m").onchange=()=>{$("nm").style.display=$("m").value==="__new"?"block":"none"};
$("mo").onchange=render;

$("add").onclick=async()=>{
 const amount=parseFloat($("a").value);
 let member=$("m").value==="__new"?$("nm").value.trim():$("m").value;
 if(!member||!(amount>0)||!$("d").value){alert("Enter a member, date and amount.");return}
 const e={date:$("d").value,member,amount,remark:$("r").value.trim(),ts:Date.now()};
 try{
  if(col){await col.add(e)}else{e.id="l"+e.ts;entries.push(e);lsSet();render()}
  $("a").value="";$("r").value="";$("nm").value="";$("nm").style.display="none";
  fillSel();$("m").value=member;
 }catch(err){alert("Could not save: "+(err.message||err.code))}
};
$("list").onclick=async ev=>{
 const b=ev.target.closest("button[data-id]");if(!b||!confirm("Delete this entry?"))return;
 const id=b.dataset.id;
 try{if(col)await col.doc(id).delete();else{entries=entries.filter(e=>e.id!==id);lsSet();render()}}
 catch(err){alert("Could not delete: "+(err.message||err.code))}
};

entries=lsGet();render();
(async()=>{
 try{
  const c=window.claude&&await claude.use("db");
  if(!c){$("st").textContent="Offline mode: entries saved on this phone only.";return}
  db=c;col=db.collection("entries");entries=[];
  col.onSnapshot(s=>{entries=s.docs.map(d=>({id:d.id,...d.data()}));render();$("st").textContent="Shared · live"},
   e=>{$("st").textContent="Sync error: "+e.message});
 }catch(e){$("st").textContent="Offline mode: entries saved on this phone only."}
})();
</script></body></html>
